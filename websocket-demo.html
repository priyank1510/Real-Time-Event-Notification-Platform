<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Notification WebSocket Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
</head>
<body>
  <h1>Real-Time Notifications</h1>
  <label>User ID: <input id="userId" value="user-1"></label>
  <button onclick="connect()">Connect</button>
  <ul id="messages"></ul>

  <script>
    let client;

    function connect() {
      const userId = document.getElementById('userId').value;

      client = new StompJs.Client({
        webSocketFactory: () => new SockJS('http://localhost:8080/ws'),
        reconnectDelay: 3000,
      });

      client.onConnect = () => {
        client.subscribe(`/topic/users/${userId}`, (frame) => {
          const notification = JSON.parse(frame.body);
          const li = document.createElement('li');
          li.textContent = `${notification.title}: ${notification.message}`;
          document.getElementById('messages').prepend(li);
        });
      };

      client.activate();
    }
  </script>
</body>
</html>
